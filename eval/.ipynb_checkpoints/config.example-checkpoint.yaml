# ============================================================
# 示例配置 / Example config —— 开箱即用的最小可运行样例
#
# 用法 / Usage（在本仓库根目录执行 / run from the repo root）:
#     cp config.example.yaml config.yaml
#     python run.py
#
# 所有路径均相对于仓库根目录 / All paths are relative to the repo root.
#
# 换成你自己的数据，只需改下面 4 处 / To use your own data, change these 4 fields:
#   1. selected_apis            -> 你的模型名（= root_dir 下的目录名）
#   2. paths.root_dir           -> 你的推理结果根目录
#   3. paths.gt_dir             -> 你的 benchmark 根目录
#   4. selected_data_category   -> 你要评测的类别子集
# ============================================================

evaluation_setup:
  # 模型列表 / model list
  # 每个名字必须对应目录: <root_dir>/<name>/<category>/results/
  # Each name must map to: <root_dir>/<name>/<category>/results/
  selected_apis:
    - demo-model-a       # 强模型：输出用 <res></res> 包裹，几乎全对
    - demo-model-b       # 弱模型：漏字、错字，用于对比

  paths:
    # 推理结果根目录 / inference output root
    #   <root_dir>/<model>/<category>/results/<file_id>.json  ->  {"answer": "..."}
    root_dir: "./example/infer_results"

    # GT 根目录 / ground-truth root
    #   <gt_dir>/<category>/conv.jsonl  ->  {"image": "...", "human_gt": "..."}
    gt_dir: "./example/gt"

    # 输出目录 / output dir（自动创建，生成 latex + xlsx + json）
    result_folder: "./example/evaluate_results"

  # 评测类别 / categories to evaluate
  # 示例只放 3 类；完整 benchmark 共 9 类，见 README
  # The demo uses 3; the full benchmark has 9 (see README)
  selected_data_category:
    - oracle_bone_artifacts            # 甲骨
    - seals                            # 玺印
    - calligraphys                     # 书法

verifier_params:
  ignore_st: false       # 是否忽略中文简繁体差异 / ignore Traditional-vs-Simplified
  ignore_punc: true      # 是否忽略中英文标点符号 / ignore punctuation
  ignore_space: true     # 是否忽略空白符号（含空格、换行等）/ ignore whitespace
  ignore_case: false     # 是否忽略英文大小写 / ignore letter case
